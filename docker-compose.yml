version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: constructiq_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-constructiq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-constructiq_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-constructiq_user} -d ${POSTGRES_DB:-constructiq_production}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: constructiq_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: constructiq_api
    restart: always
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - ./Backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DATABASE_URL=postgres://${POSTGRES_USER:-constructiq_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-constructiq_production}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: constructiq_celery
    restart: always
    command: celery -A config worker -l INFO --concurrency=2
    volumes:
      - ./Backend:/app
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-constructiq_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-constructiq_production}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

  celery_beat:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: constructiq_celery_beat
    restart: always
    command: celery -A config beat -l INFO
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-constructiq_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-constructiq_production}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db

  frontend:
    build:
      context: ./Frontend/constructiq
      dockerfile: Dockerfile
    container_name: constructiq_ui
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
