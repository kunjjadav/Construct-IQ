name: ConstructIQ Enterprise CI Pipeline

on:
  push:
    branches: [ "main", "develop", "release/*" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-audit:
    name: Backend Security & Quality Gate
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: constructiq_ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: constructiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt
          pip install ruff mypy django-stubs bandit pytest pytest-django pytest-cov requests


      - name: Backend Sanity Check
        env:
          DATABASE_URL: postgres://constructiq_ci:ci_password@localhost:5432/constructiq_test
          REDIS_URL: redis://localhost:6379/1
          CELERY_BROKER_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-key-insecure
          DEBUG: true
        run: |
          cd Backend
          python manage.py check --deploy

  frontend-audit:
    name: Frontend Architecture & Performance Gate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: Frontend/constructiq/package-lock.json

      - name: Install Dependencies
        working-directory: Frontend/constructiq
        run: npm ci

      - name: Run Type Checking
        working-directory: Frontend/constructiq
        run: npx tsc --noEmit

      - name: Run Linter
        working-directory: Frontend/constructiq
        run: npm run lint
        continue-on-error: true 

      - name: Build Application (Production Bundle)
        working-directory: Frontend/constructiq
        run: npm run build
